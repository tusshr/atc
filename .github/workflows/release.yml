name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Opens/updates the "chore: release x.y.z" PR. Merging it creates the tag and GitHub release.
      - uses: googleapis/release-please-action@v5
        id: release

      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@v7
      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - if: ${{ steps.release.outputs.release_created }}
        run: npm ci && npm run build && npm test
      - if: ${{ steps.release.outputs.release_created }}
        run: npm publish
        env:
          # Only needed for the very first publish. After that, configure trusted
          # publishing on npmjs.com and delete the NPM_TOKEN secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
